<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Sorteio - 76ª Festa de São Donato</title>
    
    <!-- Favicon / Ícone da Guia -->
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

    <header class="main-header">
        <div class="container header-container" style="justify-content: center;">

            </div>
            <div class="header-titles" style="text-align: center;">
                <span class="badge">Sistema de Sorteio</span>

                <h2>Paróquia São Donato — Içara, SC</h2>

    <main class="container main-content" style="max-width: 600px; margin-top: 40px;">
        <section class="card" style="text-align: center; padding: 35px 25px;">
            <div class="card-header">
                <h3>Escolha uma opção para testar:</h3>

            </div>

            <div class="navigation-buttons-container" style="display: flex; flex-direction: column; gap: 16px; margin-top: 25px;">

                    ⚙️ Painel do Organizador (Admin)
                </a>

                <a href="populacao.html" class="btn-secondary" style="text-decoration: none; display: block; text-align: center; font-size: 1.1rem; padding: 18px; border-radius: var(--radius);">
                    📱 Tela do Público (Ganhadores)
                </a>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container footer-container">
            <span class="footer-text">Desenvolvido por</span>
            <a href="https://doublesstech.com.br" target="_blank" rel="noopener noreferrer" class="footer-brand-link">
                <img src="assets/images/principal.png" alt="Double S Tech" class="footer-logo" onerror="this.src='https://placehold.co/120x40/6b0f1a/ffffff?text=Double+S+Tech'">
            </a>
        </div>
